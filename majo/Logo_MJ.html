:root{
  --verde:#005B42;        /* verde del logotipo UPSA */
  --verde-os:#00402F;     /* texto principal */
  --verde-cl:#7C998F;     /* texto secundario */
  --linea:#005B42;        /* borde, en el verde institucional */
  --filete:#B9CFC6;       /* separador interior, discreto */
  --papel:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#ECEFEE;                       /* solo para verla en pantalla */
  font-family:"EB Garamond",Garamond,"Book Antiqua",Georgia,serif;
}

.etiqueta{
  width:60mm;height:45mm;
  background:var(--papel);
  border:1.2mm solid var(--linea);
  border-radius:1.6mm;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4mm 5mm;text-align:center;
}

.etiqueta img{width:42mm;display:block}

/* Filete corto: separa el logotipo de los datos sin competir con ellos. */
.filete{width:15mm;height:.25mm;background:var(--filete);
  margin:3.4mm 0 3mm}

.nombre{
  font-size:3.3mm;line-height:1.25;font-weight:600;
  color:var(--verde-os);letter-spacing:.01em;
}

.carrera{
  margin-top:1.6mm;
  font-size:1.95mm;line-height:1.3;font-weight:600;white-space:nowrap;
  color:var(--verde-cl);text-transform:uppercase;letter-spacing:.07em;
}

/* Impresion: hoja carta con la etiqueta a tamano real, 6 x 4,5 cm. En el
   dialogo de impresion hay que dejar la escala en 100 % ("Tamano real") y no
   en "Ajustar a la pagina", que es lo que la encogeria. El borde verde hace
   de linea de corte. */
@page{size:letter;margin:0}
@media print{
  body{background:#fff;display:block;min-height:0}
  .etiqueta{margin:30mm auto 0}
}
</style>
